name: Test Apple download
# One-off check: can a GitHub Actions machine download Apple's Singapore
# refurbished pages? Start it from the Actions tab -> "Test Apple download" -> Run workflow.
# Needs no secrets. Delete this file once the real bot is uploaded.

on:
  workflow_dispatch:
    inputs:
      categories:
        description: "Categories to test, space-separated (mac ipad watch airpods appletv homepod accessories)"
        required: false
        default: mac

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Apple's refurbished page(s) and report what came back
        env:
          CATEGORIES: ${{ inputs.categories }}
        run: |
          python3 - <<'PY'
          import gzip, json, os, sys, time, urllib.request, urllib.error
          from collections import Counter

          CATS = (os.environ.get("CATEGORIES") or "mac").replace(",", " ").split()
          UAS = {
              "browser": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                         "(KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
              "plain": "Python-urllib/3",
          }
          MARK = "REFURB_GRID_BOOTSTRAP"
          out = []                      # markdown lines for the run's summary page
          def say(s=""):
              print(s); out.append(s)

          def fetch(url, ua):
              req = urllib.request.Request(url, headers={
                  "User-Agent": ua, "Accept": "text/html,*/*",
                  "Accept-Language": "en-SG,en;q=0.9", "Accept-Encoding": "gzip"})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body, status, final = r.read(), r.status, r.geturl()
                      if r.headers.get("Content-Encoding") == "gzip":
                          body = gzip.decompress(body)
              except urllib.error.HTTPError as e:
                  body, status, final = e.read(), e.code, url
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}", url, time.time() - t
              return body.decode("utf-8", "replace"), status, final, time.time() - t

          def parse(html):
              i = html.find(MARK)
              if i < 0:
                  return None
              obj, _ = json.JSONDecoder().raw_decode(html, html.find("{", i))
              return obj

          ok = False
          say(f"Run at {time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime())}")
          for cat in CATS:
              url = f"https://www.apple.com/sg/shop/refurbished/{cat}"
              say(f"## {cat}")
              for name, ua in UAS.items():
                  html, status, final, secs = fetch(url, ua)
                  size = len(html) if html else 0
                  say(f"- **{name} user-agent**: status `{status}`, {size:,} chars, {secs:.1f} s"
                      + (f", redirected to {final}" if final != url else ""))
                  if not html:
                      continue
                  try:
                      data = parse(html)
                  except Exception as e:
                      say(f"  - found `{MARK}` but its JSON didn't parse: {e}")
                      continue
                  if data is None:
                      title = html[html.find("<title>") + 7: html.find("</title>")][:100] if "<title>" in html else "?"
                      say(f"  - `{MARK}` NOT found. Page title: {title!r}")
                      continue
                  tiles = data.get("tiles") or []
                  say(f"  - `{MARK}` found: {len(tiles)} items")
                  if tiles:
                      ok = True
                  if name != "browser" or not tiles:
                      continue
                  dims = Counter(k for t in tiles for k in (t.get("filters", {}).get("dimensions") or {}))
                  say(f"  - filter fields: {', '.join(f'{k} ({n})' for k, n in dims.most_common())}")
                  models = Counter((t.get("filters", {}).get("dimensions") or {}).get("refurbClearModel", "?") for t in tiles)
                  say(f"  - models: {', '.join(f'{k} {n}' for k, n in models.most_common())}")
                  say("")
                  say("  | part number | price (SGD) | title |")
                  say("  |---|---|---|")
                  cheapest = sorted(tiles, key=lambda t: float(t.get("price", {}).get("currentPrice", {}).get("raw_amount") or 0))
                  for t in cheapest[:8]:
                      p = t.get("price", {}).get("currentPrice", {}).get("raw_amount")
                      title = (t.get("title") or "").replace("‑", "-").replace(" ", " ")
                      say(f"  | {t.get('partNumber')} | {p} | {title[:110]} |")
                  say("")
              time.sleep(2)

          say("**Result: " + ("Apple sent the refurbished list (REFURB_GRID_BOOTSTRAP with items).**" if ok
                               else "no items came back, see above.**"))
          summ = os.environ.get("GITHUB_STEP_SUMMARY")
          if summ:
              with open(summ, "a", encoding="utf-8") as f:
                  f.write("\n".join(out) + "\n")
          sys.exit(0 if ok else 1)
          PY
